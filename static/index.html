<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Life counter</title>
    <meta name="theme-color" content="#222">
    <link rel="icon" size="any" href="favicon.ico" type="image/x-icon" />
    <link rel="icon" size="any" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" type="image/png" />
    <link rel="manifest" href="manifest.webmanifest">
    <link rel=stylesheet type=text/css href=stylesheet/index.css />
    <link rel="license" href="LICENSE.md">

    <script type=module src=./components/screen-lock/index.mjs></script>
    <link rel=stylesheet href=./components/screen-lock/index.css />

    <script type=module src=./components/life/index.mjs></script>
    <link rel=stylesheet href=./components/life/index.css />

    <script type=module src=./components/settings/index.mjs></script>
    <link rel=stylesheet href=./components/settings/index.css />

    <script type=module src=./components/player/index.mjs></script>
    <link rel=stylesheet href=./components/player/index.css />

    <script type="module" src="scripts/index.js"></script>
</head>
<body>

    <lc-screen-lock>
        <main class="t-App">
            <header class="t-App__toolbox">
                <button type="reset" class="a-Action" aria-label="Start new game">
                    ↻
                </button>
            </header>

            <lc-player
                id=player-2
                player-name="Opponent"
                player-colour="red"
                panel-rotation="180"
                class="t-App__panel"
            >
            </lc-player>

            <lc-player
                id=player-1
                player-name="Me"
                player-colour="black"
                class="t-App__panel"
            >
            </lc-player>
        </main>
    </lc-screen-lock>

</body>
</html>
